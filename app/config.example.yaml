general:
  log_level: INFO
server:
  public_port: 8765
  enable_subtitle_sharing: true
runtime:
  profile: cuda
  device_policy: auto_discrete
  device_index: null
  device_name: ''
  allow_integrated_gpu: false
models:
  storage_path: ''
input:
  input_source: url
  url: https://www.youtube.com/watch?v=EXAMPLE
  format: ba/wa*
  cookies: ''
  cookies_by_site:
    youtube: ''
    tiktok: ''
    twitter: ''
    twitch: ''
    bilibili: ''
  proxy: ''
  source_type: youtube
  timeout: 30
  device_recording_interval: 0.1
  audio_source: url
  device_index: null
audio_slicing_vad:
  min_audio_length: 0.7
  max_audio_length: 6.0
  target_audio_length: 3.0
  continuous_no_speech_threshold: 0.5
  disable_dynamic_no_speech_threshold: false
  vad_threshold: 0.35
  disable_dynamic_vad_threshold: false
  prefix_retention_length: 0.25
  vad_enabled: true
  vad_every_n_frames: 1
  vad_backend: firered
  firered_vad_model_path: ''
transcription:
  openai_api_key: ''
  backend: qwen3-asr
  asr_compute_backend: auto
  model: Qwen/Qwen3-ASR-1.7B
  language: ja
  filters: []
  use_faster_whisper: false
  use_simul_streaming: false
  simul_streaming_encoder: whisper
  use_openai_transcription_api: false
  use_qwen3_asr: true
  use_sensevoice_asr: false
  use_fun_asr: false
  use_nemo_asr: false
  qwen3_asr_model: Qwen/Qwen3-ASR-1.7B
  qwen3_dtype: bfloat16
  qwen3_load_in_4bit: false
  qwen3_rms_threshold: 0.005
  sensevoice_model: iic/SenseVoiceSmall
  fun_asr_model: FunAudioLLM/Fun-ASR-Nano-2512
  nemo_asr_model: nvidia/parakeet-tdt_ctc-0.6b-ja
  nemo_asr_device: auto
  nemo_asr_decoding: tdt
  nemo_asr_dtype: bfloat16
  asr_corrections_enabled: false
  asr_correction_log_enabled: false
  asr_correction_learning_enabled: false
  asr_corrections_case_sensitive: false
  asr_correction_rules: []
  whisper_filters:
  - emoji_filter
  - repetition_filter
  - japanese_stream_filter
  disable_transcription_context: false
  transcription_initial_prompt: ''
  openai_transcription_model: whisper-1
translation:
  openai_api_key: ''
  google_api_key: ''
  backend: custom:localllm
  model: localllm
  translation_prompt: Translate the following text to English
  target_language: English
  history_size: 0
  timeout: 10
  gpt_model: localllm
  gemini_model: ''
  translation_history_size: 0
  translation_timeout: 10
  gpt_base_url: https://api.openai.com/v1
  gemini_base_url: https://generativelanguage.googleapis.com
  processing_proxy: null
  use_json_result: false
  retry_if_translation_fails: true
  translation_model_family: auto
  translation_output_format: auto
  translation_max_concurrency: 0
  translation_max_output_tokens: 128
  paired_subtitle_mode: true
  deduplicate_asr_overlap: true
  subtitle_assembler_enabled: true
  subtitle_assembler_wait_ms: 400
  subtitle_assembler_max_duration: 6.0
  subtitle_assembler_gap_threshold: 0.8
  custom_models:
  - name: localllm
    base_url: http://127.0.0.1:8080
    api_key: '114514'
    model_name: localllm
  api_key: ''
  use_smart_prompt: true
  smart_prompt_enabled: true
terminology:
  use_terminology_glossary: false
  translation_glossary_audit_enabled: false
  terminology_glossary: {}
  glossary: ''
  glossary_list: []
output:
  output_file: ''
  show_timestamp: true
  hide_transcript: false
  cqhttp_url: ''
  cqhttp_token: ''
  output_dir: ./output
  output_srt: true
  output_txt: false
  output_ass: false
  max_history: 20
output_notification:
  output_proxy: ''
  discord_enabled: false
  discord_webhook_url: ''
  telegram_enabled: false
  telegram_bot_token: null
  telegram_chat_id: null
  output_file_path: ''
  output_timestamps: true
  hide_transcribe_result: false
subtitle_settings:
  _visibility_defaults_v2: true
  fontSize: 24
  fontWeight: 700
  opacity: 100
  showOriginal: true
  showTranslated: true
  showTimestamp: true
  showLatency: true
  position: bottom
  autoScroll: true
  maxDisplayCount: 30
  textColor: '#55ffff'
  translatedColor: '#FFDD00'
  timestampColor: '#888888'
  latencyColor: '#7DD3FC'
  backgroundColor: '#ffffff'
  backgroundOpacity: 5
ui:
  theme: light
  transparency: 80
  font_size: 16
  font_name: Arial
  show_timestamp_in_subtitle: true
  max_history: 50
  transcript_color: rgba(255, 255, 255, 0.6)
  translation_color: '#ffffff'
  background_color:
    custom: rgba(0, 0, 0, 1)
  blur_enabled: false
  bg_opacity: 75
  windows:
    home:
      x: 100
      y: 100
      width: 600
      height: 500
      visible: true
    settings:
      x: 150
      y: 150
      width: 800
      height: 600
      visible: false
    floating_subtitle:
      x: 200
      y: 200
      width: 800
      height: 300
      visible: true
      transparency: 80
llama:
  model_dir: ./models
  model_path: ''
  recent_model_paths: []
  favorite_model_paths: []
  selected_preset: ''
  default_preset: ''
  host: 127.0.0.1
  port: 8080
  n_ctx: 2048
  n_gpu_layers: 0
  n_threads: 8
  n_parallel: 1
  top_k: 40
  top_p: 0.9
  temp: 0.8
  repeat_penalty: 1.1
  n_predict: 512
  flash_attn: false
  no_mmap: false
  custom_presets: {}
  custom_model_series: []
